project_id = "jiprvhotnoobsutdlnrf"

[functions.notify-admin]
verify_jwt = false

[functions.telegram-webhook]
verify_jwt = false

# Cron-only; guarded by the x-cron-secret header (CRON_SECRET), so the gateway
# doesn't need to check an API key/JWT — keeps the cron working without legacy keys.
[functions.notifications-scan]
verify_jwt = false

# Called by the notify_push() trigger; authenticated with the x-push-secret header.
[functions.push-send]
verify_jwt = false

# run-code trusts the gateway's JWT check and only reads the claims itself.
[functions.run-code]
verify_jwt = true
